[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-filer-api"
version = "0.1.0"
description = "REST API layer for django-filer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "django-filer>=3.3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["python_filer_api*"]
